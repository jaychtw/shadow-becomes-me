<!doctype html><html lang="en"><meta charset="utf-8"><title>Shadow animation comparison panel</title><style>body{margin:0;background:#dce1df}svg{display:block;width:100%;height:260px}</style><svg id="world" viewBox="0 280 500 240" role="img" aria-label="Isolated actual character renderer comparison"><defs></defs><path d="M0 500H500" stroke="#8ba5a0"/><g id="guard" transform="translate(245 500)"><g id="guard-body"></g><text id="guard-cue"></text><g id="guard-hp"></g></g><g id="player" transform="translate(150 500)"><path id="shadow" fill="#000" d="M-30 0V-59H30V0Z"/><path id="spike-shape"/></g></svg><script type="module">
import {renderCharacters,presentAttack,artReady} from '../src/presentation.js';import {createGame,start,attack} from '../src/engine.js';await artReady;
function show(ms){const g=createGame();start(g);g.player.x=150;g.guard.x=location.search.includes('left')?55:245;document.getElementById('guard').setAttribute('transform',`translate(${g.guard.x} 500)`);g.player.form='box';if(location.search.includes('spike'))g.guard.state='hostile';renderCharacters(g);const result=attack(g);presentAttack(g,result);g.time=ms/1000;g.player.spike=Math.max(0,.22-ms/1000);renderCharacters(g);window.preview={ms,result,guardHp:g.guard.hp};}
window.addEventListener('message',e=>{if(e.origin===location.origin&&typeof e.data.ms==='number')show(e.data.ms);});show(0);window.ready=true;
</script></html>
