<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#111f2b"><title>Shadow Becomes Me</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"></head>
<body>
<header><div><p class="eyebrow" data-i18n="eyebrow"></p><h1 data-i18n="title"></h1></div><nav aria-label="Game"><button id="help" data-i18n="help"></button><button id="language" lang="zh-TW"></button></nav></header>
<main>
 <div class="stage-heading"><span data-i18n="subtitle"></span><span data-i18n="goal"></span></div>
 <section id="stage" aria-label="Laboratory encounter">
  <svg id="world" viewBox="0 0 1100 640" role="img" aria-labelledby="scene-title scene-desc">
   <title id="scene-title"></title><desc id="scene-desc"></desc>
   <defs>
    <linearGradient id="vision"><stop stop-color="#d76558" stop-opacity=".35"/><stop offset="1" stop-color="#d76558" stop-opacity=".04"/></linearGradient>
    <linearGradient id="uniform" x2="1" y2="1"><stop stop-color="#3c6681"/><stop offset="1" stop-color="#203e57"/></linearGradient>
   </defs>
   <path d="M-100 0H1780V640H-100Z" fill="#293f50"/><path d="M-100 500H1780V640H-100Z" fill="#293f4d"/>
   <image href="art/laboratory/distant-background.png" width="1680" height="640" data-layer="distant-background"/>
<image href="art/laboratory/architecture.png" width="1680" height="640" data-layer="architecture"/>
<image href="art/laboratory/illumination.png" width="1680" height="640" data-layer="illumination"/>
<image href="art/laboratory/architectural-details.png" width="1680" height="640" data-layer="architectural-details"/>
<image href="art/laboratory/floor.png" width="1680" height="640" data-layer="floor"/>
<image href="art/laboratory/background-props.png" width="1680" height="640" data-layer="background-props"/>
<image href="art/laboratory/foreground.png" width="1680" height="640" data-layer="foreground"/>
   <g id="exit-marker"><text x="1590" y="345" text-anchor="middle" id="exit-text"></text><path d="M1575 364h30m-10-8 10 8-10 8" fill="none" stroke="#c0f4dd" stroke-width="3"/></g>
   <g id="guard-vision"></g>
   <g id="guard"><ellipse cx="0" cy="-2" rx="29" ry="5" fill="#182936" opacity=".18"/><g id="guard-body"><path d="M-13-49-18-5h13L4-40 12-5h13L15-52" fill="#253c4d"/><path d="m-20-5 15-1 1 6h-20zm33 0 12-1 6 6H13" fill="#14232f"/><path d="M-13-93Q0-101 13-93l6 43h-36Z" fill="url(#uniform)" stroke="#18374b" stroke-width="2"/><path d="M-17-56h35v7h-35" fill="#18303e"/><path d="M-13-87-19-62 9-57l2-8-20-5 9-17" fill="#355e79"/><path d="M9-66h18v8H8Z" fill="#dca385"/><path d="M-8-104v12q10 10 18-1v-17" fill="#dca385"/><path d="M-13-108q1-18 22-12l4 13h-26m-2 0h34v5h-34" fill="#24465f"/><path d="M3-110h5v5H3" fill="#dda95a"/><path d="M10-77h4v6h-4" fill="#e6b168"/></g><text id="guard-cue" x="0" y="-139" text-anchor="middle"></text><g id="guard-hp"></g></g>
   <g id="player"><ellipse cx="0" cy="-2" rx="36" ry="5" fill="#142733" opacity=".2"/><path id="shadow" fill="#000"/><path id="spike-shape" fill="#000"/></g>
   <path d="M-100 501H1780" stroke="#0b1822" stroke-width="4"/>
  </svg>
  <div id="overlay"><div class="panel"><p class="eyebrow">01 / POC</p><h2 id="overlay-title"></h2><p id="overlay-copy"></p><p id="overlay-rule"></p><button class="primary" id="begin"></button></div></div>
 </section>
 <div class="readout"><div><span data-i18n="health"></span> <strong id="health" role="img"></strong></div><div><span data-i18n="form"></span> <strong id="form"></strong></div><div><span data-i18n="guardHealth"></span> <strong id="guard-state"></strong></div><button id="pause" data-i18n="pause"></button><button id="restart" data-i18n="restart"></button></div>
 <p id="feedback" role="status" aria-live="polite"></p>
 <div class="controls" role="group" aria-label="Game controls"><div class="movement"><button id="left" aria-label="Slide left">←</button><button id="right" aria-label="Slide right">→</button></div><div class="forms"><button id="box" data-i18n="box"></button><button id="chair" data-i18n="chair"></button></div><button id="attack" class="primary" data-i18n="spike"></button></div>
 <p class="hints" data-i18n="keys"></p><p class="touch-hint" data-i18n="touchHint"></p><p class="orientation" data-i18n="orientation"></p>
</main><footer data-i18n="footer"></footer>
<script type="module" src="src/main.js"></script>
</body></html>
